<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arirang Concert Checklist · Hanbok Edition 🪭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-void: #070304;
      --bg-card: rgba(20, 7, 10, 0.88);
      --crimson-deep: #59050f;
      --crimson: #c20e2b;
      --crimson-bright: #ff2442;
      --gold: #f3c66f;
      --gold-soft: rgba(243, 198, 111, 0.28);
      --text-main: #fff6f7;
      --text-dim: #b9979e;
      --border-glass: rgba(243, 198, 111, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-void);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 28px 14px 52px;
      overflow-x: hidden;
      position: relative;
    }

    /* พื้นหลังเคลื่อนไหวสไตล์ฮันบกเกาหลี */
    .hanbok-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 15%, rgba(194, 14, 43, 0.34) 0%, transparent 45%),
        radial-gradient(circle at 82% 22%, rgba(243, 198, 111, 0.14) 0%, transparent 42%),
        linear-gradient(165deg, #090305 0%, #1c0509 50%, #0a0305 100%);
    }

    .silk-ribbon {
      position: absolute;
      width: 160%;
      height: 260px;
      left: -30%;
      border-radius: 45%;
      filter: blur(2px);
      opacity: 0.42;
      animation: silkWave 14s ease-in-out infinite;
    }

    .silk-ribbon.r1 {
      top: 8%;
      background: linear-gradient(90deg, transparent, rgba(255, 36, 66, 0.32), rgba(243, 198, 111, 0.22), transparent);
      animation-duration: 15s;
    }

    .silk-ribbon.r2 {
      top: 42%;
      background: linear-gradient(90deg, transparent, rgba(243, 198, 111, 0.18), rgba(194, 14, 43, 0.35), transparent);
      animation-duration: 19s;
      animation-direction: reverse;
    }

    .silk-ribbon.r3 {
      top: 72%;
      background: linear-gradient(90deg, transparent, rgba(138, 9, 28, 0.45), rgba(243, 198, 111, 0.14), transparent);
      animation-duration: 22s;
    }

    @keyframes silkWave {
      0%, 100% {
        transform: translateY(-18px) rotate(-3deg) scaleX(1);
      }
      50% {
        transform: translateY(20px) rotate(3deg) scaleX(1.04);
      }
    }

    .petal {
      position: absolute;
      top: -24px;
      border-radius: 100% 0 100% 25%;
      background: linear-gradient(135deg, rgba(255, 77, 102, 0.78), rgba(243, 198, 111, 0.55));
      box-shadow: 0 0 10px rgba(255, 36, 66, 0.35);
      animation: petalFall linear infinite;
    }

    @keyframes petalFall {
      0% {
        transform: translate3d(0, -20px, 0) rotate(0deg);
        opacity: 0;
      }
      12% {
        opacity: 0.85;
      }
      88% {
        opacity: 0.8;
      }
      100% {
        transform: translate3d(70px, 105vh, 0) rotate(320deg);
        opacity: 0;
      }
    }

    body.motion-paused .silk-ribbon,
    body.motion-paused .petal,
    body.motion-paused .fan-wrap,
    body.motion-paused .dot-live {
      animation-play-state: paused !important;
    }

    /* การ์ดหลัก */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 500px;
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: 28px;
      padding: 26px 20px 22px;
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.88),
        0 0 38px rgba(194, 14, 43, 0.25),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
      overflow: hidden;
    }

    /* แถบคาดสไตล์โบว์ฮันบก (고름 / Goreum) ด้านบน */
    .goreum-accent {
      position: absolute;
      top: 0;
      left: 26px;
      width: 115px;
      height: 6px;
      background: linear-gradient(90deg, var(--gold), var(--crimson-bright), var(--gold));
      border-bottom-left-radius: 99px;
      border-bottom-right-radius: 99px;
      opacity: 0.9;
    }

    .app-shell::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 21px;
      border: 1px solid rgba(243, 198, 111, 0.11);
      pointer-events: none;
    }

    /* พัดจีนมุมขวาบน */
    .fan-wrap {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 166px;
      height: 166px;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 8px 18px rgba(194, 14, 43, 0.45));
      transform-origin: 115px 162px;
      animation: gentleBreeze 5.5s ease-in-out infinite;
    }

    @keyframes gentleBreeze {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(-2deg); }
    }

    .header {
      position: relative;
      z-index: 3;
      padding-right: 105px;
      margin-bottom: 18px;
    }

    .kr-sub {
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      letter-spacing: 2.5px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.7px;
      color: #ffe0e6;
      background: linear-gradient(90deg, rgba(194, 14, 43, 0.72), rgba(89, 5, 15, 0.8));
      border: 1px solid rgba(243, 198, 111, 0.42);
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      background: linear-gradient(120deg, #ffffff 10%, #ffe6ea 55%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-card {
      position: relative;
      z-index: 3;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.04), rgba(194, 14, 43, 0.1));
      border: 1px solid rgba(243, 198, 111, 0.24);
      border-radius: 18px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 13px;
    }

    .progress-label { color: var(--text-dim); }
    .progress-stat { color: var(--gold); font-weight: 600; }

    .track {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8f081b, var(--crimson-bright), var(--gold));
      box-shadow: 0 0 14px rgba(255, 36, 66, 0.65);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ready-banner {
      margin-top: 10px;
      font-size: 12px;
      color: var(--gold);
      display: none;
      align-items: center;
      gap: 6px;
    }

    .ready-banner.show { display: flex; }

    .composer {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .composer input {
      flex: 1;
      background: rgba(8, 3, 5, 0.75);
      border: 1px solid rgba(243, 198, 111, 0.3);
      border-radius: 14px;
      padding: 11px 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .composer input::placeholder { color: #8f6f76; }
    .composer input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(243, 198, 111, 0.14);
    }

    .btn-add {
      background: linear-gradient(135deg, var(--crimson-bright), var(--crimson-deep));
      color: #fff;
      border: 1px solid rgba(243, 198, 111, 0.65);
      border-radius: 14px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .btn-add:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(255, 36, 66, 0.45);
    }

    .toolbar {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .filters {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      padding: 3px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .filter-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--crimson), #7d0917);
      color: #fff;
      font-weight: 600;
    }

    .mini-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(243, 198, 111, 0.25);
      color: var(--gold);
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: rgba(243, 198, 111, 0.16);
    }

    .icon-btn.snap-btn {
      background: linear-gradient(135deg, rgba(243, 198, 111, 0.22), rgba(194, 14, 43, 0.28));
      border-color: var(--gold);
      color: #fff3d6;
      font-weight: 600;
    }

    .checklist {
      position: relative;
      z-index: 3;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .checklist::-webkit-scrollbar { width: 5px; }
    .checklist::-webkit-scrollbar-thumb {
      background: rgba(243, 198, 111, 0.25);
      border-radius: 99px;
    }

    .item-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 36, 66, 0.28);
      cursor: pointer;
      transition: all 0.22s ease;
      user-select: none;
    }

    .item-card:hover {
      transform: translateX(3px);
      border-color: rgba(243, 198, 111, 0.55);
      background: rgba(194, 14, 43, 0.12);
    }

    .item-card.done {
      background: rgba(10, 4, 6, 0.65);
      border-color: rgba(243, 198, 111, 0.14);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid var(--crimson-bright);
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .item-card.done .check-box {
      background: linear-gradient(135deg, var(--crimson-bright), var(--crimson-deep));
      border-color: var(--gold);
    }

    .check-box svg {
      width: 14px;
      height: 14px;
      stroke: var(--gold);
      stroke-width: 3;
      fill: none;
      opacity: 0;
      transform: scale(0.4);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .item-card.done .check-box svg {
      opacity: 1;
      transform: scale(1);
    }

    .item-title {
      font-size: 14.5px;
      color: var(--text-main);
      word-break: break-word;
    }

    .item-card.done .item-title {
      text-decoration: line-through;
      color: var(--text-dim);
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .badge-status {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .item-card:not(.done) .badge-status {
      background: rgba(255, 36, 66, 0.16);
      color: #ff8696;
      border: 1px solid rgba(255, 36, 66, 0.35);
    }

    .item-card.done .badge-status {
      background: rgba(243, 198, 111, 0.16);
      color: var(--gold);
      border: 1px solid rgba(243, 198, 111, 0.42);
    }

    .del-btn {
      background: transparent;
      border: none;
      color: #8b6870;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 8px;
      cursor: pointer;
    }

    .del-btn:hover {
      color: #ff4d64;
      background: rgba(255, 36, 66, 0.14);
    }

    .empty-state {
      text-align: center;
      padding: 34px 16px;
      color: var(--text-dim);
      font-size: 13.5px;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(28, 10, 14, 0.96);
      border: 1px solid var(--gold);
      color: var(--text-main);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.28s ease;
      z-index: 99;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.65);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .footer-wave {
      position: relative;
      z-index: 2;
      margin-top: 18px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- พื้นหลังเคลื่อนไหวลายผ้าฮันบกและกลีบดอกไม้ -->
  <div class="hanbok-bg" id="hanbokBg" aria-hidden="true">
    <div class="silk-ribbon r1"></div>
    <div class="silk-ribbon r2"></div>
    <div class="silk-ribbon r3"></div>
  </div>

  <main class="app-shell" id="captureTarget">
    <div class="goreum-accent"></div>

    <!-- พัดจีนมุมขวาบน -->
    <svg class="fan-wrap" viewBox="0 0 220 220" aria-hidden="true">
      <defs>
        <linearGradient id="silkRed" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff2b47"/>
          <stop offset="55%" stop-color="#b80d28"/>
          <stop offset="100%" stop-color="#47040c"/>
        </linearGradient>
      </defs>
      <line x1="115" y1="162" x2="115" y2="196" stroke="#f3c66f" stroke-width="2.5"/>
      <circle cx="115" cy="198" r="4.5" fill="#f3c66f"/>
      <path d="M 115 162 L 24 84 A 122 122 0 0 1 202 80 Z" fill="url(#silkRed)" stroke="#f3c66f" stroke-width="2.5"/>
      <g stroke="#f3c66f" stroke-width="1.2" opacity="0.82">
        <line x1="115" y1="162" x2="45" y2="66"/>
        <line x1="115" y1="162" x2="72" y2="50"/>
        <line x1="115" y1="162" x2="102" y2="42"/>
        <line x1="115" y1="162" x2="132" y2="42"/>
        <line x1="115" y1="162" x2="160" y2="50"/>
        <line x1="115" y1="162" x2="185" y2="66"/>
      </g>
      <circle cx="115" cy="86" r="6" fill="#f3c66f"/>
      <circle cx="84" cy="96" r="4" fill="#f3c66f" opacity="0.8"/>
      <circle cx="146" cy="96" r="4" fill="#f3c66f" opacity="0.8"/>
      <circle cx="115" cy="162" r="7" fill="#f3c66f" stroke="#59050f" stroke-width="2"/>
    </svg>

    <header class="header">
      <div class="kr-sub">한복 · 아리랑 · HANBOK</div>
      <div class="tag-pill">
        <span class="dot-live"></span>
        <span>CONCERT PACKING LIST</span>
      </div>
      <h1 id="boardTitle">เช็กลิสต์ของไปคอน</h1>
    </header>

    <section class="progress-card">
      <div class="progress-top">
        <span class="progress-label">เตรียมของครบหรือยัง</span>
        <span class="progress-stat" id="progressStat">0 / 0 (0%)</span>
      </div>
      <div class="track">
        <div class="fill" id="progressFill"></div>
      </div>
      <div class="ready-banner" id="readyBanner">
        <span>🪭</span>
        <span>ครบ 100% แล้ว! พร้อมไปสนุกหน้าฮอลล์แบบปังๆ</span>
      </div>
    </section>

    <div class="composer" data-html2canvas-ignore="true">
      <input type="text" id="itemInput" placeholder="พิมพ์ของที่ต้องเอาไปคอน..." onkeydown="if(event.key==='Enter') addItem()" />
      <button class="btn-add" onclick="addItem()">+ เพิ่ม</button>
    </div>

    <div class="toolbar" data-html2canvas-ignore="true">
      <div class="filters">
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">ทั้งหมด</button>
        <button class="filter-btn" data-filter="pending" onclick="setFilter('pending', this)">ยังไม่เอาไป</button>
        <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">เอาไปแล้ว</button>
      </div>
      <div class="mini-actions">
        <button class="icon-btn snap-btn" onclick="saveAsImage()" title="บันทึกลิสต์เป็นรูปภาพ">บันทึกรูป</button>
        <button class="icon-btn" onclick="toggleMotion()" id="motionBtn" title="เปิด/ปิดพื้นหลังเคลื่อนไหว">พักฉาก</button>
        <button class="icon-btn" onclick="copyList()" title="คัดลอกลิสต์">คัดลอก</button>
        <button class="icon-btn" onclick="resetChecks()" title="ล้างเครื่องหมายติ๊ก">รีเซ็ต</button>
      </div>
    </div>

    <ul class="checklist" id="checklist"></ul>

    <svg class="footer-wave" viewBox="0 0 440 24" width="100%" height="24" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 10 Q 22 0, 44 10 T 88 10 T 132 10 T 176 10 T 220 10 T 264 10 T 308 10 T 352 10 T 396 10 T 440 10" fill="none" stroke="#f3c66f" stroke-width="1.6"/>
      <path d="M0 17 Q 22 7, 44 17 T 88 17 T 132 17 T 176 17 T 220 17 T 264 17 T 308 17 T 352 17 T 396 17 T 440 17" fill="none" stroke="#ff2442" stroke-width="1.6"/>
    </svg>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const SHEET_API_URL = "";
    const STORAGE_KEY = "arirang_concert_todo_hanbok_v1";

    const DEFAULT_ITEMS = [
      { id: 1, name: "บัตรคอนเสิร์ต / บัตรประชาชน", done: false },
      { id: 2, name: "แท่งไฟ + ถ่านสำรอง", done: false },
      { id: 3, name: "พาวเวอร์แบงก์ + สายชาร์จ", done: false },
      { id: 4, name: "พัดจีน / พัดมือคลายร้อน", done: false },
      { id: 5, name: "ยาดม / ลูกอม / ทิชชู่เปียก", done: false },
      { id: 6, name: "กระเป๋าคาดลำตัว / ถุงซิปล็อก", done: false }
    ];

    let state = {
      title: "เช็กลิสต์ของไปคอน",
      filter: "all",
      items: []
    };

    function spawnPetals() {
      const bg = document.getElementById("hanbokBg");
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("span");
        p.className = "petal";
        const size = 8 + Math.random() * 8;
        p.style.width = `${size}px`;
        p.style.height = `${size * 0.75}px`;
        p.style.left = `${Math.random() * 100}%`;
        p.style.animationDuration = `${8 + Math.random() * 9}s`;
        p.style.animationDelay = `${-Math.random() * 10}s`;
        bg.appendChild(p);
      }
    }

    function toggleMotion() {
      const paused = document.body.classList.toggle("motion-paused");
      document.getElementById("motionBtn").textContent = paused ? "เล่นฉาก" : "พักฉาก";
      showToast(paused ? "หยุดพื้นหลังเคลื่อนไหวชั่วคราว" : "เปิดพื้นหลังเคลื่อนไหวฮันบกแล้ว");
    }

    async function saveAsImage() {
      if (typeof html2canvas === "undefined") {
        showToast("ตัวบันทึกรูปกำลังโหลด ลองกดอีกครั้งนะ");
        return;
      }
      showToast("กำลังสร้างรูปภาพลิสต์...");
      const target = document.getElementById("captureTarget");
      const prevMaxH = target.style.maxHeight;
      const listEl = document.getElementById("checklist");
      const prevListMaxH = listEl.style.maxHeight;

      // ขยายรายการให้ครบทุกข้อตอนแคปเป็นรูป
      listEl.style.maxHeight = "none";
      target.style.maxHeight = "none";

      try {
        const canvas = await html2canvas(target, {
          backgroundColor: "#090305",
          scale: 2,
          useCORS: true
        });
        const link = document.createElement("a");
        link.download = `arirang-checklist-${Date.now()}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        showToast("บันทึกรูป PNG เรียบร้อย!");
      } catch {
        showToast("บันทึกรูปไม่สำเร็จ ลองแคปหน้าจอแทนได้เลยนะ");
      } finally {
        listEl.style.maxHeight = prevListMaxH;
        target.style.maxHeight = prevMaxH;
      }
    }

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.title = parsed.title || state.title;
          state.items = Array.isArray(parsed.items) ? parsed.items : [...DEFAULT_ITEMS];
        } catch {
          state.items = [...DEFAULT_ITEMS];
        }
      } else {
        state.items = [...DEFAULT_ITEMS];
      }
      render();

      if (SHEET_API_URL) {
        fetch(SHEET_API_URL)
          .then(res => res.json())
          .then(data => {
            if (data && data.header) state.title = data.header;
            if (!saved && Array.isArray(data.items) && data.items.length > 0) {
              state.items = data.items.map((name, idx) => ({
                id: Date.now() + idx,
                name,
                done: false
              }));
            }
            saveState();
            render();
          })
          .catch(() => showToast("ดึงข้อมูลจากชีตไม่สำเร็จ ใช้ลิสต์ในเครื่องแทนนะ"));
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        title: state.title,
        items: state.items
      }));
    }

    function addItem() {
      const input = document.getElementById("itemInput");
      const text = input.value.trim();
      if (!text) {
        showToast("พิมพ์ชื่อสิ่งของก่อนนะ");
        input.focus();
        return;
      }
      state.items.push({ id: Date.now() + Math.random(), name: text, done: false });
      input.value = "";
      saveState();
      render();
      showToast("เพิ่มรายการเรียบร้อย");
    }

    function toggleItem(id) {
      const target = state.items.find(i => i.id === id);
      if (!target) return;
      target.done = !target.done;
      saveState();
      render();
    }

    function deleteItem(event, id) {
      event.stopPropagation();
      state.items = state.items.filter(i => i.id !== id);
      saveState();
      render();
      showToast("ลบรายการแล้ว");
    }

    function setFilter(filterName, btnEl) {
      state.filter = filterName;
      document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      if (btnEl) btnEl.classList.add("active");
      render();
    }

    function resetChecks() {
      if (state.items.length === 0) return;
      state.items.forEach(i => i.done = false);
      saveState();
      render();
      showToast("รีเซ็ตสถานะทั้งหมดแล้ว");
    }

    function copyList() {
      if (state.items.length === 0) {
        showToast("ยังไม่มีรายการให้คัดลอก");
        return;
      }
      const lines = state.items.map(i => `${i.done ? "☑" : "☐"} ${i.name} (${i.done ? "เอาไปแล้ว" : "ยังไม่ได้เอาไป"})`);
      const output = `🪭 ${state.title}\n` + lines.join("\n");
      navigator.clipboard.writeText(output)
        .then(() => showToast("คัดลอกลิสต์ไปวางต่อได้เลย!"))
        .catch(() => showToast("คัดลอกไม่สำเร็จ ลองอีกครั้งนะ"));
    }
