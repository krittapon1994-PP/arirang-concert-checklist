<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายการที่ต้องเอาไปคอนBTS · Arirang Hanbok Edition 🪭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-void: #070204;
      --bg-card: rgba(21, 7, 11, 0.88);
      --crimson-deep: #57050f;
      --crimson: #c40e2b;
      --crimson-bright: #ff2444;
      --gold: #f5c973;
      --text-main: #fff7f8;
      --text-dim: #bc989f;
      --border-glass: rgba(245, 201, 115, 0.30);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-void);
      color: var(--text-main);
      padding: 18px;
      overflow-x: hidden;
      position: relative;
    }

    /* พื้นหลังเคลื่อนไหวสไตล์ฮันบก & โคมไฟเกาหลี */
    .hanbok-stage {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 12%, rgba(255, 36, 68, 0.34) 0%, transparent 45%),
        radial-gradient(circle at 85% 18%, rgba(245, 201, 115, 0.16) 0%, transparent 42%),
        radial-gradient(circle at 50% 92%, rgba(120, 8, 24, 0.54) 0%, transparent 55%),
        linear-gradient(160deg, #080204 0%, #1d050a 48%, #090204 100%);
    }

    .lantern-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(44px);
      opacity: 0.45;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }

    .lantern-orb.o1 {
      width: 280px;
      height: 280px;
      top: 6%;
      left: -40px;
      background: radial-gradient(circle, #ff2444, transparent 70%);
    }

    .lantern-orb.o2 {
      width: 260px;
      height: 260px;
      top: 45%;
      right: -50px;
      background: radial-gradient(circle, #f5c973, transparent 72%);
      animation-duration: 15s;
    }

    .lantern-orb.o3 {
      width: 320px;
      height: 320px;
      bottom: 4%;
      left: 22%;
      background: radial-gradient(circle, #b50c27, transparent 70%);
      animation-duration: 18s;
    }

    @keyframes orbFloat {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      100% { transform: translate3d(28px, -30px, 0) scale(1.12); }
    }

    .silk-wave {
      position: absolute;
      width: 170%;
      height: 250px;
      left: -35%;
      border-radius: 46%;
      opacity: 0.48;
      animation: silkSway 14s ease-in-out infinite;
    }

    .silk-wave.w1 {
      top: 10%;
      background: linear-gradient(90deg, transparent, rgba(255, 36, 68, 0.34), rgba(245, 201, 115, 0.24), transparent);
    }

    .silk-wave.w2 {
      top: 44%;
      background: linear-gradient(90deg, transparent, rgba(245, 201, 115, 0.2), rgba(196, 14, 43, 0.36), transparent);
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .silk-wave.w3 {
      top: 74%;
      background: linear-gradient(90deg, transparent, rgba(138, 9, 28, 0.45), rgba(245, 201, 115, 0.16), transparent);
      animation-duration: 21s;
    }

    @keyframes silkSway {
      0%, 100% { transform: translateY(-20px) rotate(-3.5deg) scaleX(1); }
      50% { transform: translateY(22px) rotate(3.5deg) scaleX(1.05); }
    }

    .petal {
      position: absolute;
      top: -24px;
      border-radius: 100% 0 100% 25%;
      background: linear-gradient(135deg, rgba(255, 77, 102, 0.85), rgba(245, 201, 115, 0.65));
      box-shadow: 0 0 10px rgba(255, 36, 68, 0.4);
      animation: petalDrift linear infinite;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffe7a8;
      box-shadow: 0 0 10px #f5c973, 0 0 18px #ff2444;
      animation: twinkle 3.6s ease-in-out infinite;
    }

    @keyframes petalDrift {
      0% { transform: translate3d(0, -20px, 0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.9; }
      88% { opacity: 0.85; }
      100% { transform: translate3d(75px, 106vh, 0) rotate(340deg); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.95; transform: scale(1.35); }
    }

    /* กล่องหลัก: มือถือเป็นแนวตั้ง คอมเป็นแนวนอนเต็มจอ */
    .app-shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 540px;
      min-height: calc(100vh - 36px);
      margin: 0 auto;
      background: var(--bg-card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: 26px;
      padding: 24px 18px 20px;
      box-shadow:
        0 26px 64px rgba(0, 0, 0, 0.88),
        0 0 42px rgba(196, 14, 43, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .goreum-ribbon {
      position: absolute;
      top: 0;
      left: 24px;
      width: 124px;
      height: 6px;
      background: linear-gradient(90deg, var(--gold), var(--crimson-bright), var(--gold));
      border-bottom-left-radius: 99px;
      border-bottom-right-radius: 99px;
    }

    .app-shell::after {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 19px;
      border: 1px solid rgba(245, 201, 115, 0.11);
      pointer-events: none;
    }

    .fan-wrap {
      position: absolute;
      top: -16px;
      right: -16px;
      width: 156px;
      height: 156px;
      pointer-events: none;
      z-index: 2;
      filter: drop-shadow(0 8px 18px rgba(196, 14, 43, 0.48));
      transform-origin: 115px 162px;
      animation: gentleBreeze 5.2s ease-in-out infinite;
    }

    @keyframes gentleBreeze {
      0%, 100% { transform: rotate(-11deg); }
      50% { transform: rotate(-1deg); }
    }

    .content-grid {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      padding-right: 96px;
    }

    .kr-sub {
      font-family: 'Noto Serif KR', serif;
      font-size: 12px;
      letter-spacing: 2.5px;
      color: var(--gold);
      margin-bottom: 4px;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      color: #ffe2e8;
      background: linear-gradient(90deg, rgba(196, 14, 43, 0.78), rgba(87, 5, 15, 0.85));
      border: 1px solid rgba(245, 201, 115, 0.45);
      padding: 4px 11px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .dot-live {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold);
      animation: pulseDot 1.8s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.3;
      background: linear-gradient(120deg, #ffffff 10%, #ffe8ec 55%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .progress-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(196, 14, 43, 0.12));
      border: 1px solid rgba(245, 201, 115, 0.25);
      border-radius: 18px;
      padding: 14px 16px;
    }

    .progress-top {
